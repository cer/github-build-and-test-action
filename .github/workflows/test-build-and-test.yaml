name: Test build-and-test action

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  default-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use the fake Gradle project
        run: cp -r test-scripts/fixtures/fake-gradle-project/. .

      - uses: ./build-and-test

      - name: Check that the action ran ./gradlew build --build-cache
        run: test "$(cat gradlew-invocations.log)" = "build --build-cache"

  default-build-uploads-reports:
    needs: default-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-and-test-reports
          path: downloaded

      - name: Check that the reports were uploaded
        run: test "$(cat "$(find downloaded -name report.txt)")" = "report from fake gradlew"

  build-commands-run-in-order:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./build-and-test
        with:
          build-commands: |
            echo first >> commands.log
            echo second >> commands.log

      - name: Check that the commands ran in order
        run: test "$(cat commands.log)" = "$(printf 'first\nsecond')"

  failing-build-command-stops-the-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./build-and-test
        id: build
        continue-on-error: true
        with:
          build-commands: |
            echo first >> commands.log
            false
            echo second >> commands.log

      - name: Check that the action failed
        run: test "${{ steps.build.outcome }}" = failure

      - name: Check that the commands after the failing one did not run
        run: test "$(cat commands.log)" = first
