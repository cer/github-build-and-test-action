name: 'Build and Test'
description: 'Set up JDK and Gradle, and build the Java project'

inputs:
  build-commands:
    description: 'Commands that build and test the project, one per line. They run in order, and the first that fails stops the build.'
    required: false
    default: './gradlew build --build-cache'

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Build
      shell: bash
      run: ${{ inputs.build-commands }}

    - name: Save test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-and-test-reports
        path: |
          **/build/reports
          **/build/test-results
